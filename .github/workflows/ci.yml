name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Frontend, Rust Backend & E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Audit Rust dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install frontend dependencies & run static guards, typecheck, unit tests, and build
        working-directory: web
        run: |
          npm ci
          npm run lint:guards
          npm run check
          npm test
          npm run build

      - name: Run Rust unit & integration tests (-D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked

      - name: Build release single binary (-D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --locked

      - name: Ensure Chromium / Chrome browser is available for Playwright
        working-directory: web
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright end-to-end suite against release binary
        working-directory: web
        run: npm run e2e
